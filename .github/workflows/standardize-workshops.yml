name: Standardize Workshops

# docs/workshops/workshops.md 가 변경되면, included: true 로 표시된 워크샵을
# 사이트 공통 단계형 포맷으로 표준화합니다.
# 상세 규칙: .github/skills/workshop-standardization/SKILL.md
on:
  push:
    paths:
      - 'docs/workshops/workshops.md'
      - 'docs/assets/js/workshop-data.js'
      - 'scripts/*workshop*.mjs'
      - 'package*.json'
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'

permissions:
  contents: write

concurrency:
  group: standardize-workshops
  cancel-in-progress: false

jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test workshop integration
        run: npm test

      - name: Standardize included workshops
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync:workshops

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/workshops docs/sitemap.xml docs/llms.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: standardize included workshops"
            git push
          fi
